spring.jpa.show-sql=false
logging.level.root=WARN

# Avoid background jobs during contextLoads tests
quartz.job.expired-package.enabled=false
quartz.job.waitlist-refund.enabled=false

# Redis from workflow env (defaults suit local docker-compose)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
