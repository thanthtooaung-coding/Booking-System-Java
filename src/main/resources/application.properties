spring.application.name=booking-system

# Actuator health (and info) for /actuator/health and RootHealthController (GET /)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

spring.datasource.url=${SPRING_DATABASE_URL}
spring.datasource.username=${SPRING_DATABASE_USERNAME}
spring.datasource.password=${SPRING_DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

springdoc.swagger-ui.filter=true
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.doc-expansion=none

jwt.secret=${JWT_SECRET:XzJYpEKnS5QfK5S7PnVq+0u8ZmR/dqXJtZOmT1rPaRnLZX/B1M60v6K1oXoSaqMJQ/a+jkKxsm3RT2gfFez7og==}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Quartz Scheduler Configuration
spring.quartz.job-store-type=memory
spring.quartz.properties.org.quartz.scheduler.instanceName=BookingSystemScheduler
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO

# Quartz Job Configuration - Expired User Package Job
quartz.job.expired-package.enabled=true
quartz.job.expired-package.cron=0 0 * * * ?
quartz.job.expired-package.batch-size=50

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:mypassword}
spring.data.redis.timeout=2000ms

# Spring Cache (Redis)
spring.cache.type=redis
spring.cache.redis.time-to-live=${CACHE_TTL_MS:3600000}
app.cache.crud-enabled=${CRUD_CACHE_ENABLED:true}

# Quartz Job Configuration - Waitlist Refund Job
quartz.job.waitlist-refund.enabled=true
quartz.job.waitlist-refund.cron=0 */15 * * * ?
quartz.job.waitlist-refund.batch-size=50

spring.output.ansi.enabled=never

logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [${spring.application.name}] [%thread] %logger{36} - %msg%n%wEx
logging.pattern.file=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [${spring.application.name}] [%thread] %logger{36} - %msg%n%wEx

logging.level.root=INFO
